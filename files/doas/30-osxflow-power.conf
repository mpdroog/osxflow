# /etc/doas.d/30-osxflow-power.conf -- what macmenu's Sleep, Restart and Shut Down
# rows need to work without a password.
#
# This machine has no elogind, so there is no loginctl and no D-Bus call
# that can suspend or halt it: the only ways down are /sbin/poweroff,
# /sbin/reboot and a write to /sys/power/state, all root-only. Each is
# named in full here, so this grants those three commands and nothing
# else -- in particular not a shell, which "permit nopass mp" alone
# would amount to.
permit nopass mp cmd /sbin/poweroff
permit nopass mp cmd /sbin/reboot
permit nopass mp cmd /usr/local/sbin/osxflow-suspend
